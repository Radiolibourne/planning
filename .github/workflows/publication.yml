# Tests à chaque modification ; publication du site sur GitHub Pages si les tests passent (branche main).
# Toutes les heures : republication pour rafraîchir les calendriers d'abonnement (planning publié dans Firebase).
name: Tests et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils de test
        run: |
          pip install -r outils/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Construction et tests
        run: python tests/lancer_tests.py

  publication:
    needs: tests
    if: always() && github.event_name != 'pull_request' && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construction du site
        run: python outils/construire.py
      - name: Calendriers d'abonnement
        env:
          CODE_EQUIPE: ${{ secrets.CODE_EQUIPE }}
        run: python outils/calendriers_abonnement.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploiement
        uses: actions/deploy-pages@v5
