# Tests à chaque modification ; publication du site sur GitHub Pages si les tests passent (branche main).
# Toutes les heures : republication pour rafraîchir les calendriers d'abonnement (planning publié dans Firebase)
# et envoi des notifications (publication, rappels des dates limites).
name: Tests et publication

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      veille:
        description: "Tester la veille (enregistre un signe d'activité tout de suite)"
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
    - cron: "41 5 1,15 * *"   # veille : empêche la mise en pause des tâches planifiées (voir job « veille »)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils de test
        run: |
          pip install -r outils/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Construction et tests
        run: python tests/lancer_tests.py

  publication:
    needs: tests
    if: always() && github.event_name != 'pull_request' && (needs.tests.result == 'success' || needs.tests.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construction du site
        run: python outils/construire.py
      - name: Calendriers d'abonnement
        env:
          CODE_EQUIPE: ${{ secrets.CODE_EQUIPE }}
          FIREBASE_CLE: ${{ secrets.FIREBASE_CLE }}
        run: |
          pip install google-auth requests
          python outils/calendriers_abonnement.py
      - name: Clé publique des notifications
        env:
          FIREBASE_CLE: ${{ secrets.FIREBASE_CLE }}
        run: |
          pip install cryptography
          python outils/notifications.py --cle-publique
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploiement
        uses: actions/deploy-pages@v5

  # Règles de sécurité Firebase : publiées automatiquement à chaque modification validée (si les secrets existent).
  regles:
    needs: tests
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: pip install google-auth requests
      - name: Publication des règles de sécurité
        env:
          FIREBASE_CLE: ${{ secrets.FIREBASE_CLE }}
          CODE_EQUIPE: ${{ secrets.CODE_EQUIPE }}
          ADMIN_UID: ${{ secrets.ADMIN_UID }}
        run: python outils/publier_regles.py

  # Notifications sur les téléphones : toutes les heures, et après chaque modification (si les secrets existent).
  notifications:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: notifications
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: pip install google-auth requests cryptography
      - name: Envoi des notifications
        env:
          FIREBASE_CLE: ${{ secrets.FIREBASE_CLE }}
          CODE_EQUIPE: ${{ secrets.CODE_EQUIPE }}
          ADMIN_UID: ${{ secrets.ADMIN_UID }}
        run: python outils/notifications.py

  # Veille : GitHub met en pause les tâches planifiées d'un dépôt public après 60 jours sans modification.
  # Le 1er et le 15 du mois, si le dernier envoi date de plus de 25 jours, un petit fichier daté est mis à jour
  # et envoyé : le dépôt reste « actif », calendriers et notifications continuent sans intervention.
  veille:
    if: (github.event_name == 'schedule' && github.event.schedule == '41 5 1,15 * *') || (github.event_name == 'workflow_dispatch' && inputs.veille)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Signe d'activité si besoin
        run: |
          dernier=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - dernier ) / 86400 ))
          echo "Dernière modification il y a $age jour(s)."
          if [ "$age" -lt 25 ] && [ "${{ inputs.veille }}" != "true" ]; then exit 0; fi
          date -u +"%Y-%m-%d %H:%M UTC" > .github/veille.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/veille.txt
          git commit -m "Veille automatique : maintien des tâches planifiées (calendriers, notifications)"
          git push
